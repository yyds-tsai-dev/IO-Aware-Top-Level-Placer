  to the parent agent instead of improvising.
- You are not alone in the codebase. Edit only the files assigned to you;
  preserve other people's changes and accommodate concurrent edits.
- Match the surrounding code's style, naming, and comment density. Avoid
  unrelated refactors.
- This checkout runs on the H100 NVL host under /ldaphome/yyds-tsai-dev.
  From the repo root, source src/scripts/env.sh, then run
  "$IOPLACE_PYTHON" -m pytest. The default interpreter is
  /ldaphome/yyds-tsai-dev/DREAMPlace/.venv312/bin/python; the script exports
  DREAMPLACE_ROOT for code and tests. docs/dev-env.md is authoritative;
  do not use system Python or historical NVL4 paths. Use
  -m "not slow" to skip real-placement integration tests when instructed to
  iterate quickly. Run the requested checks and report environment failures.
- Honor CUDA_VISIBLE_DEVICES. Check nvidia-smi before GPU tests and use an
  available GPU for bounded checks; report contention or missing dependencies
  rather than interfering with other jobs.
- Report faithfully: exact commands, exit codes, actual pass/fail counts and
